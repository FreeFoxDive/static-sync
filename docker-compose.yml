services:
  syncer:
    build: .
    image: static-sync:local
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      CONFIG_DIR: /config
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
