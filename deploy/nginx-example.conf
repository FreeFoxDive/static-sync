# 宿主机 nginx 片段。放入已有 server { } 内。
# 假设项目目录为 /opt/static-sync，compose 将 ./data 挂到容器 /data，
# 静态文件在 /opt/static-sync/data/public。
# syncer 只映射到 127.0.0.1:8080，不要把 8080 对公网开放。

# 静态镜像（只读已落盘文件；访问未同步的路径返回 404，不会回源）
location /static-sync/ {
    alias /opt/static-sync/data/public/;
    autoindex off;
    expires 1h;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
    location ~* \.(php|jsp|asp|aspx)$ {
        return 403;
    }
}

# 同步状态（反代到本机 syncer）
location = /sync-status {
    proxy_pass http://127.0.0.1:8080/status;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /sync-health {
    proxy_pass http://127.0.0.1:8080/health;
    proxy_set_header Host $host;
}

# 若希望更短路径，可改用（与上面 /static-sync/ 二选一或并存）：
# location /sing-box/ {
#     alias /opt/static-sync/data/public/sing-box/;
#     autoindex off;
#     expires 1h;
#     add_header X-Content-Type-Options nosniff;
# }
